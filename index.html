
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#167e99">
  <meta name="description" content="Kalasamvad Foundation Attendance App">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kalasamvad">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Kalasamvad Attendance</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(145deg,#e9faff,#f5f8fc);
      font-family: Arial, sans-serif;
      color: #243447;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: white;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 12px 40px #167e9920;
    }

    .logo {
      width: 115px;
      height: 115px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      color: #167e99;
      font-size: 25px;
      margin: 8px 0;
    }

    p {
      color: #738096;
      line-height: 1.6;
      font-size: 14px;
    }

    .open-btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      border: 0;
      border-radius: 12px;
      background: #167e99;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .install-btn {
      display: none;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #167e99;
      border-radius: 12px;
      background: white;
      color: #167e99;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #9aa5b1;
    }
  </style>
</head>

<body>
  <main class="app">

    <img
      class="logo"
      src="https://drive.google.com/thumbnail?id=1K_oWejGxXp-p47o8YvXCSSchOE7A9wPT&sz=w500"
      alt="Kalasamvad Foundation Logo"
    >

    <h1>Kalasamvad Attendance</h1>

    <p>
      Kalasamvad Foundation<br>
      Staff Attendance & Field Activity System
    </p>

    <a
      class="open-btn"
      href="https://script.google.com/macros/s/AKfycbwpSUwz6RzTpNTSLuiKwHkfw6gPEskwKMvpKt8b0B4BL0sP8TRo2aYekvZyUOgToJKyWw/exec"
    >
      Open Attendance App
    </a>

    <button id="installButton" class="install-btn">
      Install Kalasamvad App
    </button>

    <div class="footer">
      © Kalasamvad Foundation
    </div>

  </main>

  <script>
    // Register Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js")
          .then(function() {
            console.log("Kalasamvad App is ready");
          })
          .catch(function(error) {
            console.log("Service Worker Error:", error);
          });
      });
    }

    // Install App button
    let installPrompt;

    const installButton = document.getElementById("installButton");

    window.addEventListener("beforeinstallprompt", function(event) {
      event.preventDefault();
      installPrompt = event;
      installButton.style.display = "block";
    });

    installButton.addEventListener("click", async function() {
      if (!installPrompt) return;

      installPrompt.prompt();

      await installPrompt.userChoice;

      installPrompt = null;
      installButton.style.display = "none";
    });

    window.addEventListener("appinstalled", function() {
      installButton.style.display = "none";
    });
  </script>

</body>
</html>
